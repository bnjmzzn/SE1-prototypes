<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{margin:0;overflow:hidden;background:#fff;font-family:sans-serif}
#drawer{position:fixed;top:0;left:0;bottom:0;width:200px;background:#f4f4f4;border-right:1px solid #999;transition:transform .2s;z-index:10;display:none;padding:16px;box-sizing:border-box}
#drawer.collapsed{transform:translateX(-200px)}
#toggle{position:absolute;top:8px;right:-34px;width:34px;height:34px;cursor:pointer;border:1px solid #999;background:#f4f4f4}
#drawer nav{display:flex;flex-direction:column;gap:8px;margin-top:12px}
button{padding:8px 12px;cursor:pointer;background:#fff;border:1px solid #999}
#menu{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:none;gap:8px;padding:8px;background:#fff;border:1px solid #999;z-index:5}
#info{position:fixed;top:16px;right:16px;display:none;padding:12px;background:#fff;border:1px solid #999;line-height:1.5;z-index:5}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:20}
.modal-box{background:#fff;padding:20px;min-width:240px;line-height:1.6}
.modal-box input{width:100%;box-sizing:border-box;padding:6px;margin:8px 0}
.qr-placeholder{width:140px;height:140px;background:#000;margin:12px auto}
.lb-list{list-style:none;padding:0;margin:8px 0}
.lb-list li{display:flex;justify-content:space-between;border-bottom:1px dashed #ccc;padding:4px 0}
</style>
</head>
<body>

<div id="authBar" style="position:fixed;top:16px;left:16px;z-index:5;">
    <button id="signInBtn">Sign In</button>
</div>

<div id="drawer">
    <button id="toggle">&#9776;</button>
    <div style="font-weight:bold;margin-bottom:8px;">Menu</div>
    <div>Coins: <span id="coinDisplay">1,250</span></div>
    <nav>
        <button id="dashboardBtn">Dashboard</button>
        <button id="topupBtn">Top Up</button>
        <button id="leaderboardBtn">Leaderboard</button>
        <button id="signOutBtn">Sign Out</button>
    </nav>
</div>

<div id="menu"></div>
<div id="info"></div>

<div id="modal" class="modal">
    <div class="modal-box">
        <b>Place building?</b>
        <div id="summary"></div>
        <input id="nameInput" maxlength="24">
        <button id="confirm">Confirm</button>
        <button id="cancel">Cancel</button>
    </div>
</div>

<div id="dashboardModal" class="modal">
    <div class="modal-box">
        <b>Dashboard</b>
        <div>Welcome.<br>Total Coins: 1,250<br>Buildings Owned: <span id="ownedCount">0</span></div>
        <button id="closeDashboard">Close</button>
    </div>
</div>

<div id="topupModal" class="modal">
    <div class="modal-box" style="text-align:center;">
        <b>Top Up Coins</b>
        <div>Scan QR code:</div>
        <div class="qr-placeholder"></div>
        <button id="closeTopup">Close</button>
    </div>
</div>

<div id="leaderboardModal" class="modal">
    <div class="modal-box">
        <b>Leaderboard</b>
        <ul class="lb-list">
            <li><span>1. ApexBuilder</span> <span>12,450</span></li>
            <li><span>2. CityPlanner</span> <span>9,820</span></li>
            <li><span>3. UrbanLegend</span> <span>8,100</span></li>
            <li><span>4. GridMaster</span> <span>6,400</span></li>
            <li><span>5. PixelPioneer</span> <span>4,250</span></li>
        </ul>
        <button id="closeLeaderboard">Close</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
<script>
const GRID=100, CELL=48, CENTER_START=40, CENTER_END=60, MIN_ZOOM=0.2, MAX_ZOOM=4, DRAG_THRESHOLD=5;
let PLAYER_NAME="Guest", SYSTEM_NAME="System", isSignedIn=false;

const drawer=document.getElementById("drawer"), signInBtn=document.getElementById("signInBtn"), signOutBtn=document.getElementById("signOutBtn");
const dashboardBtn=document.getElementById("dashboardBtn"), topupBtn=document.getElementById("topupBtn"), leaderboardBtn=document.getElementById("leaderboardBtn");
const dashboardModal=document.getElementById("dashboardModal"), topupModal=document.getElementById("topupModal"), leaderboardModal=document.getElementById("leaderboardModal");

signInBtn.onclick=()=>{
    isSignedIn=true; PLAYER_NAME="Player1";
    drawer.style.display="block"; signInBtn.style.display="none";
};

signOutBtn.onclick=()=>{
    isSignedIn=false; PLAYER_NAME="Guest";
    drawer.style.display="none"; signInBtn.style.display="inline-block";
    clearSelection();
};

const toggleModal=(m, show)=>m.style.display=show?"flex":"none";

dashboardBtn.onclick=()=>{
    document.getElementById("ownedCount").textContent=entities.filter(e=>e.info.placedBy===PLAYER_NAME).length;
    toggleModal(dashboardModal, true);
};
document.getElementById("closeDashboard").onclick=()=>toggleModal(dashboardModal, false);

topupBtn.onclick=()=>toggleModal(topupModal, true);
document.getElementById("closeTopup").onclick=()=>toggleModal(topupModal, false);

leaderboardBtn.onclick=()=>toggleModal(leaderboardModal, true);
document.getElementById("closeLeaderboard").onclick=()=>toggleModal(leaderboardModal, false);

const BUILDINGS=[
    {name:"House",color:0x4a90d9,shape:"square",cost:100},
    {name:"Tower",color:0xe67e22,shape:"circle",cost:250},
    {name:"Farm",color:0x27ae60,shape:"triangle",cost:150},
    {name:"Shop",color:0x9b59b6,shape:"diamond",cost:200},
    {name:"Temple",color:0xc0392b,shape:"hexagon",cost:500}
];

const ROAD_TYPE=3, ROAM_TYPE=2, ROAD_RADIUS=4, ROAD_WIDTH=6, ROAD_COLOR=0x555555, ROAM_RADIUS=CELL*1.2, ROAM_SPEED=40, ROAM_PAUSE_MIN=0.4, ROAM_PAUSE_MAX=2;
const roamers=[], entities=[], entityMap=new Map();
let selectedCell=null, pendingType=null, buildingCounter=0;

const cellKey=(x,y)=>y*GRID+x;

function drawShape(g,s){
    const h=CELL/2, p=6;
    if(s==="square") return g.rect(p,p,CELL-p*2,CELL-p*2);
    if(s==="circle") return g.circle(h,h,h-p);
    if(s==="triangle") return g.poly([h,p,CELL-p,CELL-p,p,CELL-p]);
    if(s==="diamond") return g.poly([h,p,CELL-p,h,h,CELL-p,p,h]);
    g.poly([p+8,p,CELL-p-8,p,CELL-p,h,CELL-p-8,CELL-p,p+8,CELL-p,p,h]);
}

const createInfo=(t,n,p)=>({name:n,placedBy:p,date:new Date().toLocaleDateString(),cost:BUILDINGS[t].cost,id:++buildingCounter});

async function main(){
    const app=new PIXI.Application();
    await app.init({resizeTo:window,background:"#ffffff",antialias:true});
    document.body.appendChild(app.canvas);

    document.getElementById("toggle").onclick=()=>drawer.classList.toggle("collapsed");

    const world=new PIXI.Container();
    app.stage.addChild(world);
    world.x=window.innerWidth/2-(GRID*CELL)/2;
    world.y=window.innerHeight/2-(GRID*CELL)/2;

    const grid=new PIXI.Graphics();
    for(let i=0;i<=GRID;i++){
        grid.moveTo(i*CELL,0).lineTo(i*CELL,GRID*CELL).moveTo(0,i*CELL).lineTo(GRID*CELL,i*CELL);
    }
    grid.stroke({width:1,color:0xcccccc,pixelLine:true});
    world.addChild(grid);

    const roadGraphics=new PIXI.Graphics(), entityLayer=new PIXI.Container(), roamerLayer=new PIXI.Container();
    world.addChild(roadGraphics, entityLayer, roamerLayer);

    const highlight=new PIXI.Graphics().rect(0,0,CELL,CELL).stroke({width:3,color:0xff0000});
    highlight.visible=false;
    world.addChild(highlight);

    const textures=BUILDINGS.map(b=>{
        const g=new PIXI.Graphics();
        drawShape(g,b.shape);
        g.fill(b.color);
        return app.renderer.generateTexture({target:g,frame:new PIXI.Rectangle(0,0,CELL,CELL),resolution:2});
    });

    function placeEntity(x,y,t,info){
        const k=cellKey(x,y);
        if(entityMap.has(k)) return;
        const sprite=new PIXI.Sprite(textures[t]);
        sprite.x=x*CELL; sprite.y=y*CELL;
        entityLayer.addChild(sprite);
        const entity={x,y,type:t,sprite,info};
        entities.push(entity);
        entityMap.set(k,entity);
        if(t===ROAD_TYPE) refreshRoads();
        if(t===ROAM_TYPE) spawnRoamer(entity);
    }

    function findNearestSame(e){
        let nearest=null, minD=Infinity;
        for(let dy=-ROAD_RADIUS;dy<=ROAD_RADIUS;dy++){
            for(let dx=-ROAD_RADIUS;dx<=ROAD_RADIUS;dx++){
                if(!dx&&!dy) continue;
                const nx=e.x+dx, ny=e.y+dy;
                if(nx<0||ny<0||nx>=GRID||ny>=GRID) continue;
                const n=entityMap.get(cellKey(nx,ny));
                if(n&&n.type===e.type){
                    const d=dx*dx+dy*dy;
                    if(d<minD){minD=d; nearest=n;}
                }
            }
        }
        return nearest;
    }

    function refreshRoads(){
        roadGraphics.clear();
        const drawn=new Set();
        entities.forEach(e=>{
            if(e.type!==ROAD_TYPE) return;
            const t=findNearestSame(e);
            if(!t) return;
            const kA=cellKey(e.x,e.y), kB=cellKey(t.x,t.y), pk=Math.min(kA,kB)+"-"+Math.max(kA,kB);
            if(drawn.has(pk)) return;
            drawn.add(pk);
            roadGraphics.moveTo(e.x*CELL+CELL/2,e.y*CELL+CELL/2).lineTo(t.x*CELL+CELL/2,t.y*CELL+CELL/2);
        });
        roadGraphics.stroke({width:ROAD_WIDTH,color:ROAD_COLOR});
    }

    const randomPause=()=>ROAM_PAUSE_MIN+Math.random()*(ROAM_PAUSE_MAX-ROAM_PAUSE_MIN);
    const pickTarget=r=>{
        const a=Math.random()*Math.PI*2, d=Math.random()*ROAM_RADIUS;
        r.targetX=r.homeX+Math.cos(a)*d; r.targetY=r.homeY+Math.sin(a)*d;
    };

    function spawnRoamer(e){
        const dot=new PIXI.Graphics().circle(0,0,4).fill(0x000000);
        dot.x=e.x*CELL+CELL/2; dot.y=e.y*CELL+CELL/2;
        roamerLayer.addChild(dot);
        const r={sprite:dot,homeX:dot.x,homeY:dot.y,targetX:dot.x,targetY:dot.y,wait:randomPause()};
        pickTarget(r); roamers.push(r);
    }

    app.ticker.add(t=>{
        const sec=t.deltaMS/1000;
        roamers.forEach(r=>{
            if(r.wait>0){r.wait-=sec; return;}
            const dx=r.targetX-r.sprite.x, dy=r.targetY-r.sprite.y, dist=Math.hypot(dx,dy), step=ROAM_SPEED*sec;
            if(dist<=step){
                r.sprite.x=r.targetX; r.sprite.y=r.targetY;
                r.wait=randomPause(); pickTarget(r); return;
            }
            r.sprite.x+=(dx/dist)*step; r.sprite.y+=(dy/dist)*step;
        });
    });

    for(let y=CENTER_START;y<CENTER_END;y++){
        for(let x=CENTER_START;x<CENTER_END;x++){
            const t=Math.floor(Math.random()*BUILDINGS.length);
            placeEntity(x,y,t,createInfo(t,BUILDINGS[t].name+" "+(buildingCounter+1),SYSTEM_NAME));
        }
    }

    const menu=document.getElementById("menu"), infoPanel=document.getElementById("info"), modal=document.getElementById("modal");
    const summary=document.getElementById("summary"), nameInput=document.getElementById("nameInput");

    function showInfo(e){
        const b=BUILDINGS[e.type];
        infoPanel.innerHTML=`<b>${e.info.name}</b><br>Type: ${b.name}<br>Placed by: ${e.info.placedBy}<br>Date: ${e.info.date}<br>Cost: $${e.info.cost}<br>Cell: ${e.x}, ${e.y}`;
        infoPanel.style.display="block";
    }

    function openConfirm(t){
        const b=BUILDINGS[t]; pendingType=t;
        summary.innerHTML=`Type: ${b.name}<br>Placed by: ${PLAYER_NAME}<br>Date: ${new Date().toLocaleDateString()}<br>Cost: $${b.cost}<br>Cell: ${selectedCell.x}, ${selectedCell.y}`;
        nameInput.value=`${b.name} ${buildingCounter+1}`;
        toggleModal(modal, true);
    }

    const closeConfirm=()=>{pendingType=null; toggleModal(modal, false);};
    document.getElementById("cancel").onclick=closeConfirm;

    document.getElementById("confirm").onclick=()=>{
        if(!selectedCell||pendingType===null) return;
        const finalName=nameInput.value.trim()||BUILDINGS[pendingType].name;
        placeEntity(selectedCell.x,selectedCell.y,pendingType,createInfo(pendingType,finalName,PLAYER_NAME));
        closeConfirm(); clearSelection();
    };

    BUILDINGS.forEach((b,i)=>{
        const btn=document.createElement("button");
        btn.textContent=`${b.name} ($${b.cost})`;
        btn.style.borderBottom=`4px solid #${b.color.toString(16).padStart(6,"0")}`;
        btn.onclick=()=>selectedCell&&openConfirm(i);
        menu.appendChild(btn);
    });

    function clearSelection(){
        selectedCell=null; highlight.visible=false;
        menu.style.display="none"; infoPanel.style.display="none";
    }

    function handleClick(sx,sy){
        const wx=(sx-world.x)/world.scale.x, wy=(sy-world.y)/world.scale.y;
        const cx=Math.floor(wx/CELL), cy=Math.floor(wy/CELL);
        clearSelection();
        if(cx<0||cy<0||cx>=GRID||cy>=GRID) return;
        selectedCell={x:cx,y:cy};
        highlight.x=cx*CELL; highlight.y=cy*CELL; highlight.visible=true;
        const existing=entityMap.get(cellKey(cx,cy));
        if(existing) return showInfo(existing);
        if(isSignedIn) menu.style.display="flex";
    }

    let dragging=false, moved=false, startX=0, startY=0, lastX=0, lastY=0;

    app.canvas.addEventListener("pointerdown", e=>{
        dragging=true; moved=false;
        startX=lastX=e.clientX; startY=lastY=e.clientY;
    });

    window.addEventListener("pointermove", e=>{
        if(!dragging) return;
        if(Math.hypot(e.clientX-startX, e.clientY-startY)>DRAG_THRESHOLD) moved=true;
        if(!moved) return;
        world.x+=e.clientX-lastX; world.y+=e.clientY-lastY;
        lastX=e.clientX; lastY=e.clientY;
    });

    window.addEventListener("pointerup", e=>{
        if(!dragging) return;
        dragging=false;
        if(!moved) handleClick(e.clientX, e.clientY);
    });

    app.canvas.addEventListener("wheel", e=>{
        e.preventDefault();
        const factor=e.deltaY<0?1.1:1/1.1;
        const nextScale=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,world.scale.x*factor));
        const wx=(e.clientX-world.x)/world.scale.x, wy=(e.clientY-world.y)/world.scale.y;
        world.scale.set(nextScale);
        world.x=e.clientX-wx*nextScale; world.y=e.clientY-wy*nextScale;
    },{passive:false});
}

main();
</script>
</body>
</html>
