<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
:root{--bg:#f8f9fa;--surface:#fff;--surface-alt:#f3f4f6;--border:#e5e7eb;--border-strong:#d1d5db;--text:#111827;--text-muted:#6b7280;--accent:#2563eb;--accent-soft:#eff6ff;--danger:#dc2626;--danger-soft:#fef2f2;--radius:8px;--shadow:0 4px 16px rgba(17,24,39,.08)}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas{touch-action:none;display:block}
b{font-weight:600}
button{font:inherit;font-size:13px;font-weight:500;color:var(--text);padding:8px 14px;cursor:pointer;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:var(--surface-alt)}
button.active,button.primary{background:var(--text);border-color:var(--text);color:#fff}
button.active:hover:not(:disabled),button.primary:hover:not(:disabled){background:#1f2937}
button:disabled{opacity:.45;cursor:default}
input:not([type=checkbox]),select{font:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:8px 10px;outline:none}
input:not([type=checkbox]):focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent);margin:0}

#authBar{position:fixed;top:12px;left:12px;z-index:5}
#userChip{position:fixed;top:12px;left:12px;z-index:5;display:none;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);color:var(--text-muted)}
#userChip b{color:var(--text)}
#adminTools{position:fixed;top:60px;left:12px;z-index:5;display:none}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--radius);box-shadow:var(--shadow);display:none;z-index:50}

#drawer{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--surface);border-right:1px solid var(--border);transition:transform .2s;z-index:10;display:none;padding:16px}
#drawer.collapsed{transform:translateX(-220px)}
#toggle{position:absolute;top:12px;right:-44px;width:36px;height:36px;padding:0;font-size:16px;box-shadow:var(--shadow)}
#drawer>b{display:block;font-size:15px;padding:4px 4px 0}
#dock{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#drawer #userChip,#drawer #info,#drawer #adminTools{position:static;min-width:0;max-width:none;box-shadow:none}
#drawer #adminTools button{width:100%}
#drawer nav{display:flex;flex-direction:column;gap:4px;margin-top:12px}
#drawer nav button{text-align:left;border-color:transparent;background:transparent}
#drawer nav button:hover{background:var(--surface-alt)}

#bottomNav{position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--surface);border-top:1px solid var(--border);display:none;justify-content:space-around;align-items:center;z-index:9}
#bottomNav button{padding:6px 8px;font-size:11px;border-color:transparent;background:transparent}

#menu{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:none;gap:8px;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:5;max-width:90vw;overflow-x:auto}
#menu button{display:flex;align-items:center;gap:8px;white-space:nowrap}
#menu img{width:24px;height:24px;object-fit:contain}
#menu img[src=""]{display:none}
#pickBar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:none;gap:8px;align-items:center;padding:8px 8px 8px 16px;background:var(--surface);border:1px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);z-index:6}
#pickCount{font-weight:500;margin-right:8px}
#info{position:fixed;top:16px;right:16px;display:none;padding:14px 16px;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);line-height:1.7;color:var(--text-muted);z-index:5}
#info b{color:var(--text);font-size:15px}
#info button{margin-top:8px;color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}

.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(17,24,39,.4);z-index:40}
.modal-box{background:var(--surface);padding:24px;min-width:280px;line-height:1.6;max-width:92vw;border-radius:12px;box-shadow:0 16px 48px rgba(17,24,39,.2)}
.modal-box>b{display:block;font-size:16px;margin-bottom:8px}
.modal-box input:not([type=checkbox]){width:100%;margin:6px 0}
.modal-box label{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--text-muted);font-size:13px}
.modal-box>button{margin-top:12px;margin-right:6px}
.wide{width:min(680px,92vw);max-height:80vh;overflow:auto}
.lb-list{list-style:none;padding:0;margin:8px 0}
.lb-list li{display:flex;justify-content:space-between;gap:24px;border-bottom:1px solid var(--border);padding:8px 0}

#admin{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
#adminHead{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
#adminTabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
#adminTabs button{border-color:transparent;background:transparent}
#adminTabs button.active,.tabs button.active{background:var(--text)}
#adminBody{flex:1;overflow:auto;padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text-muted);font-size:13px}
.card b{display:block;font-size:22px;margin-top:4px;color:var(--text)}
.ph{border:1px dashed var(--border-strong);border-radius:10px;background:var(--surface);height:180px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);margin-bottom:16px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tabs button{padding:6px 12px;border-color:transparent;background:var(--surface-alt)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);background:var(--surface-alt)}
th,td{border-bottom:1px solid var(--border);padding:10px 12px;text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:none}
td button{padding:4px 10px;font-size:12px}
.err{color:var(--danger);min-height:18px;font-size:13px}
.banner{background:var(--danger-soft);border:1px solid #fecaca;color:#991b1b;border-radius:var(--radius);padding:10px 12px;margin:8px 0;font-size:13px}
.info{background:var(--accent-soft);border:1px solid #bfdbfe;color:#1e40af;border-radius:var(--radius);padding:10px 12px;margin:8px 0;font-size:13px}
.pkgs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pkgs button{padding:10px 16px;line-height:1.5}
.pkgs button:hover{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;margin-top:12px}
.captcha{display:flex;align-items:center}
.captcha .box{width:18px;height:18px;border:1px solid var(--border-strong);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;font-size:12px;background:var(--surface)}
.captcha.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:600px){
#menu,#pickBar{bottom:68px}
#info{top:60px;right:12px;max-width:80vw}
}
</style>
</head>
<body>

<div id="authBar"><button id="signInBtn" class="primary">Sign In</button></div>
<div id="userChip"></div>
<div id="adminTools"><button id="selectBtn">Select mode: off</button></div>
<div id="toast"></div>

<div id="drawer" class="collapsed">
    <button id="toggle">&#9776;</button>
    <b>Menu</b>
    <div id="dock"></div>
    <nav>
        <button data-act="dashboard">Dashboard</button>
        <button data-act="topup">Top Up</button>
        <button data-act="leaderboard">Leaderboard</button>
        <button data-act="admin" class="adminOnly">Admin Panel</button>
        <button data-act="signout">Sign Out</button>
    </nav>
</div>

<div id="bottomNav">
    <button data-act="dashboard">Dashboard</button>
    <button data-act="topup">Top Up</button>
    <button data-act="leaderboard">Leaderboard</button>
    <button data-act="admin" class="adminOnly">Admin</button>
    <button data-act="signout">Sign Out</button>
</div>

<div id="menu"></div>
<div id="pickBar"><span id="pickCount"></span><button id="pickRemove">Remove</button><button id="pickClear">Clear</button></div>
<div id="info"></div>

<div id="authModal" class="modal">
    <div class="modal-box">
        <b>Sign In</b>
        <input id="authUser" placeholder="Username" maxlength="20" autocomplete="off">
        <input id="authPass" type="password" placeholder="Password">
        <label><input type="checkbox" id="authCaptcha"> I am not a robot</label>
        <div class="err" id="authError"></div>
        <button id="authSubmit" class="primary">Continue</button>
        <button data-close="authModal">Cancel</button>
    </div>
</div>

<div id="signoutModal" class="modal">
    <div class="modal-box">
        <b>Sign out?</b>
        <button id="signoutConfirm" class="primary">Sign Out</button>
        <button data-close="signoutModal">Cancel</button>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-box">
        <b>Place building?</b>
        <div id="summary"></div>
        <input id="nameInput" maxlength="24">
        <div class="err" id="confirmError"></div>
        <button id="confirm" class="primary">Confirm</button>
        <button id="cancel">Cancel</button>
    </div>
</div>

<div id="dashboardModal" class="modal">
    <div class="modal-box wide">
        <b>Dashboard</b>
        <div id="dashBody"></div>
        <button data-close="dashboardModal">Close</button>
    </div>
</div>

<div id="topupModal" class="modal">
    <div class="modal-box wide">
        <b>Top Up Gold</b>
        <div id="topupBody"></div>
        <button data-close="topupModal">Close</button>
    </div>
</div>

<div id="leaderboardModal" class="modal">
    <div class="modal-box">
        <b>Leaderboard (gold spent on buildings)</b>
        <ul class="lb-list" id="lbList"></ul>
        <button data-close="leaderboardModal">Close</button>
    </div>
</div>

<div id="reasonModal" class="modal">
    <div class="modal-box">
        <b id="reasonTitle"></b>
        <input id="amountInput" type="number" min="1" step="1" placeholder="Amount (g)">
        <input id="reasonInput" maxlength="120" placeholder="Reason (required)">
        <label id="optRemoveWrap"><input type="checkbox" id="optRemove"> Remove all their buildings</label>
        <label id="optRefundWrap"><input type="checkbox" id="optRefund"> Refund gold spent on removed buildings</label>
        <div class="err" id="reasonError"></div>
        <button id="reasonConfirm" class="primary">Confirm</button>
        <button data-close="reasonModal">Cancel</button>
    </div>
</div>

<div id="admin">
    <div id="adminHead">
        <b>Admin Panel</b>
        <div id="adminTabs"></div>
        <button data-close="admin">Back to canvas</button>
    </div>
    <div id="adminBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
<script>
const BUILDINGS=[
    {name:"House",src:"https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Hut/3D/hut_3d.png",cost:100},
    {name:"Tower",src:"https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Mount%20fuji/3D/mount_fuji_3d.png",cost:250},
    {name:"Farm",src:"https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Deciduous%20tree/3D/deciduous_tree_3d.png",cost:150},
    {name:"Shop",src:"https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Convenience%20store/3D/convenience_store_3d.png",cost:200},
    {name:"Temple",src:"https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Classical%20building/3D/classical_building_3d.png",cost:500}
];
const ROAMER_SRCS=[
    "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Bird/3D/bird_3d.png",
    "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Dove/3D/dove_3d.png",
    "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Front-facing%20baby%20chick/3D/front-facing_baby_chick_3d.png",
    "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Duck/3D/duck_3d.png"
];
const ROAMER_SIZE=18;

const GRID=100, CELL=48, CENTER_START=40, CENTER_END=60, MIN_ZOOM=0.2, MAX_ZOOM=4, DRAG_THRESHOLD=5, DAY=86400000, TOPUP_TTL=1800000;
const MOBILE_WIDTH=600, SPRITE_SIZE=CELL-8, FALLBACK_TINT=0x9ca3af, BOB_AMP=2, BOB_SPEED_MIN=0.8, BOB_SPEED_MAX=1.6, LABEL_PAD=6;
const SCATTER_COUNT=160, SCATTER_RADIUS=9;
const PACKAGES=[50,150,300,500,1000];
const MOD_TYPES=["user_banned","user_unbanned","building_removed","gold_credited"];
const byId=id=>document.getElementById(id);
const fmtGold=amount=>amount.toLocaleString()+" g";
const fmtDate=timestamp=>new Date(timestamp).toLocaleString();
const signed=amount=>(amount>0?"+":"")+amount.toLocaleString()+" g";
const newest=(first,second)=>second.at-first.at;
const esc=text=>String(text).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
const detail=data=>data?esc(Object.entries(data).map(([key,value])=>key+"="+value).join(", ")):"";
const toggleModal=(element,show)=>element.style.display=show?"flex":"none";

function table(headers,rows){
    if(!rows.length){
        return "<p>No records.</p>";
    }
    return `<div class="scroll"><table><tr>${headers.map(header=>`<th>${header}</th>`).join("")}</tr>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}</table></div>`;
}

let toastTimer=null;
function toast(message){
    const toastEl=byId("toast");
    toastEl.textContent=message;
    toastEl.style.display="block";
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toastEl.style.display="none",2500);
}

const users=[], topups=[], events=[];
let idSeq=0;
const newId=prefix=>prefix+(++idSeq);
const findUser=username=>users.find(user=>user.username===username);
const userById=id=>users.find(user=>user.id===id);
const nameOf=id=>{
    const user=userById(id);
    return user?user.username:"system";
};

function addUser(username,password,gold,role){
    const user={id:newId("u"),username,password,gold,role,createdAt:Date.now()};
    users.push(user);
    return user;
}

function logEvent(type,actorId,targetId,delta,reason,data,at){
    events.push({id:newId("e"),type,actorId,targetId,delta:delta||0,reason:reason||null,data:data||null,at:at||Date.now()});
}

const adminUser=addUser("admin","admin",0,"admin");
const seedUsers=["user1","cityplanner","urbanlegend","gridmaster","pixelpioneer","trollmaster"].map(name=>addUser(name,"password123",Math.floor(Math.random()*8)*50,name==="trollmaster"?"banned":"user"));

seedUsers.forEach(user=>{
    const count=2+Math.floor(Math.random()*3);
    for(let index=0;index<count;index++){
        const amount=PACKAGES[Math.floor(Math.random()*PACKAGES.length)];
        const roll=Math.random();
        const status=roll<0.7?"completed":roll<0.85?"failed":"expired";
        const createdAt=Date.now()-Math.random()*14*DAY;
        const topup={id:newId("t"),userId:user.id,php:amount,status,createdAt,expiresAt:createdAt+TOPUP_TTL,updatedAt:createdAt,ref:"cs_"+Math.random().toString(36).slice(2,10)};
        topups.push(topup);
        if(status==="completed"){
            logEvent("topup_completed",null,user.id,amount,null,{topup_id:topup.id,php_amount:amount},createdAt);
        }
    }
});

const trollUser=findUser("trollmaster"), plannerUser=findUser("cityplanner");
logEvent("building_removed",adminUser.id,trollUser.id,0,"Spam placement",{building_type:"Temple",x:50,y:50,gold_spent:500},Date.now()-5*DAY);
logEvent("user_banned",adminUser.id,trollUser.id,0,"Repeated spam placement",null,Date.now()-5*DAY+60000);
logEvent("gold_credited",adminUser.id,plannerUser.id,100,"Refund for building removed by mistake",null,Date.now()-2*DAY);
plannerUser.gold+=100;

let currentUser=null;
const isAdmin=()=>currentUser&&currentUser.role==="admin";
const isBanned=()=>currentUser&&currentUser.role==="banned";

const drawer=byId("drawer"), bottomNav=byId("bottomNav");
const DOCKED=["userChip","adminTools"];

function checkLayout(){
    const isMobile=window.innerWidth<=MOBILE_WIDTH;
    const host=isMobile||!currentUser?document.body:byId("dock");
    DOCKED.forEach(id=>{
        const element=byId(id);
        if(element.parentElement!==host){
            host.appendChild(element);
        }
    });
    drawer.style.display=currentUser&&!isMobile?"block":"none";
    bottomNav.style.display=currentUser&&isMobile?"flex":"none";
}
window.addEventListener("resize",checkLayout);

function refreshChrome(){
    byId("signInBtn").style.display=currentUser?"none":"inline-block";
    const chip=byId("userChip");
    chip.style.display=currentUser?"block":"none";
    if(currentUser){
        chip.innerHTML=`<b>${esc(currentUser.username)}</b> (${currentUser.role}) &middot; ${fmtGold(currentUser.gold)}`;
    }
    document.querySelectorAll(".adminOnly").forEach(button=>button.style.display=isAdmin()?"inline-block":"none");
    byId("adminTools").style.display=isAdmin()?"block":"none";
    checkLayout();
}

ROAD_TYPES=[0,3], ROAM_TYPE=2, ROAD_RADIUS=4, ROAD_WIDTH=6, ROAD_COLOR=0x9ca3af, ROAM_RADIUS=CELL*1.2, ROAM_SPEED=40, ROAM_PAUSE_MIN=0.4, ROAM_PAUSE_MAX=2;
const roamers=[], entities=[], entityMap=new Map(), actions={drawPicks(){}};
const picked=new Set(), adminSelected=new Set();
let selectedCell=null, pendingType=null, buildingCounter=0, selectMode=false;
const cellKey=(x,y)=>y*GRID+x;

const createInfo=(type,name,ownerId)=>({name,ownerId,at:Date.now(),cost:BUILDINGS[type].cost,id:++buildingCounter});

let clearSelection=()=>{};

function updatePickBar(){
    const show=isAdmin()&&picked.size>0;
    byId("pickBar").style.display=show?"flex":"none";
    byId("pickCount").textContent=picked.size+" selected";
}

let reasonHandler=null;
function askReason(title,config,onSubmit){
    byId("reasonTitle").textContent=title;
    byId("amountInput").style.display=config.amount?"block":"none";
    byId("amountInput").value="";
    byId("reasonInput").value="";
    byId("reasonError").textContent="";
    byId("optRemove").checked=false;
    byId("optRefund").checked=false;
    byId("optRemoveWrap").style.display=config.ban?"flex":"none";
    byId("optRefundWrap").style.display=config.ban||config.refund?"flex":"none";
    byId("optRefund").disabled=!!config.ban;
    reasonHandler=onSubmit;
    toggleModal(byId("reasonModal"),true);
}

byId("optRemove").onchange=()=>{
    const remove=byId("optRemove").checked;
    byId("optRefund").disabled=!remove;
    if(!remove){
        byId("optRefund").checked=false;
    }
};

byId("reasonConfirm").onclick=()=>{
    const reason=byId("reasonInput").value.trim();
    if(!reason){
        byId("reasonError").textContent="Reason is required.";
        return;
    }
    const flags={remove:byId("optRemove").checked,refund:byId("optRefund").checked&&!byId("optRefund").disabled};
    const error=reasonHandler(reason,Number(byId("amountInput").value),flags);
    if(error){
        byId("reasonError").textContent=error;
        return;
    }
    toggleModal(byId("reasonModal"),false);
    reasonHandler=null;
    toast("Done");
    afterAdminChange();
};

function afterAdminChange(){
    if(byId("admin").style.display==="flex"){
        renderAdmin();
    }
    refreshChrome();
    clearSelection();
    actions.drawPicks();
    updatePickBar();
}

function adminRemoveBuilding(entity,reason){
    if(!entityMap.has(cellKey(entity.x,entity.y))){
        return "Building no longer exists.";
    }
    const snapshot={building_type:BUILDINGS[entity.type].name,x:entity.x,y:entity.y,gold_spent:entity.info.cost};
    actions.removeEntity(entity);
    logEvent("building_removed",currentUser.id,entity.info.ownerId,0,reason,snapshot);
    return null;
}

function removeBuildings(list,reason,refund){
    const refunds=new Map();
    list.forEach(entity=>{
        const cost=entity.info.cost, ownerId=entity.info.ownerId, buildingId=entity.info.id;
        if(adminRemoveBuilding(entity,reason)){
            return;
        }
        adminSelected.delete(buildingId);
        refunds.set(ownerId,(refunds.get(ownerId)||0)+cost);
    });
    if(!refund){
        return;
    }
    refunds.forEach((total,ownerId)=>{
        userById(ownerId).gold+=total;
        logEvent("gold_credited",currentUser.id,ownerId,total,"Refund for removed buildings: "+reason);
    });
}

function adminBan(userId,reason,flags){
    const target=userById(userId);
    if(target.role!=="user"){
        return "Only regular users can be banned.";
    }
    target.role="banned";
    logEvent("user_banned",currentUser.id,target.id,0,reason);
    if(flags.remove){
        removeBuildings(entities.filter(entity=>entity.info.ownerId===target.id),reason,flags.refund);
    }
    return null;
}

function adminUnban(userId){
    const target=userById(userId);
    if(target.role!=="banned"){
        return "User is not banned.";
    }
    target.role="user";
    logEvent("user_unbanned",currentUser.id,target.id,0,null);
    return null;
}

function adminCredit(userId,amount,reason){
    if(!Number.isInteger(amount)||amount<=0){
        return "Amount must be a positive whole number.";
    }
    const target=userById(userId);
    target.gold+=amount;
    logEvent("gold_credited",currentUser.id,target.id,amount,reason);
    return null;
}

function askRemove(list,title){
    askReason(title,{refund:true},(reason,amount,flags)=>{
        removeBuildings(list,reason,flags.refund);
        return null;
    });
}

function expireStaleTopups(){
    const now=Date.now();
    topups.forEach(topup=>{
        if(topup.status!=="pending"||topup.expiresAt>=now){
            return;
        }
        topup.status="expired";
        topup.updatedAt=now;
    });
}

function webhook(topupId){
    const topup=topups.find(item=>item.id===topupId);
    if(topup.status==="completed"||topup.status==="failed"){
        return "duplicate";
    }
    topup.status="completed";
    topup.updatedAt=Date.now();
    const owner=userById(topup.userId);
    owner.gold+=topup.php;
    logEvent("topup_completed",null,owner.id,topup.php,null,{topup_id:topup.id,php_amount:topup.php});
    return "completed";
}

function openAuth(){
    byId("authUser").value="";
    byId("authPass").value="";
    byId("authCaptcha").checked=false;
    byId("authError").textContent="";
    toggleModal(byId("authModal"),true);
}

function submitAuth(){
    const username=byId("authUser").value.trim().toLowerCase();
    const password=byId("authPass").value;
    const error=byId("authError");
    if(!byId("authCaptcha").checked){
        error.textContent="Please complete the captcha.";
        return;
    }
    const existing=findUser(username);
    if(existing){
        if(existing.password!==password){
            error.textContent="Invalid credentials.";
            return;
        }
        currentUser=existing;
    }else{
        if(!/^[a-z0-9_]{3,20}$/.test(username)){
            error.textContent="Username: 3 to 20 characters, a-z, 0-9, underscore.";
            return;
        }
        if(!password){
            error.textContent="Password is required.";
            return;
        }
        currentUser=addUser(username,password,0,"user");
        toast("Account created");
    }
    toggleModal(byId("authModal"),false);
    refreshChrome();
}

function handleSignOut(){
    currentUser=null;
    selectMode=false;
    picked.clear();
    adminSelected.clear();
    byId("selectBtn").textContent="Select mode: off";
    byId("selectBtn").classList.remove("active");
    document.querySelectorAll(".modal,#admin").forEach(element=>element.style.display="none");
    refreshChrome();
    clearSelection();
    actions.drawPicks();
    updatePickBar();
}

const freshTopup=message=>({view:"packages",topup:null,message:message||"",pkg:null,human:false});
let topupFlow=freshTopup();

function openTopup(){
    expireStaleTopups();
    const pending=topups.find(item=>item.userId===currentUser.id&&item.status==="pending");
    topupFlow=pending?{view:"checkout",topup:pending,message:"You have a pending checkout."}:freshTopup();
    renderTopup();
    toggleModal(byId("topupModal"),true);
}

function renderTopup(){
    const body=byId("topupBody");
    const message=topupFlow.message?`<div class="info">${topupFlow.message}</div>`:"";
    const banned=isBanned()?`<div class="banner">Your account is banned. Topups are disabled.</div>`:"";
    if(topupFlow.view==="packages"){
        const ready=topupFlow.pkg&&topupFlow.human;
        const pkgButtons=PACKAGES.map(amount=>`<button data-pkg="${amount}" class="${amount===topupFlow.pkg?"active":""}">${fmtGold(amount)}<br>PHP ${amount}</button>`).join("");
        body.innerHTML=`${banned}${message}<div>Select a package (1 g = PHP 1)</div><div class="pkgs">${pkgButtons}</div><button class="captcha ${topupFlow.human?"on":""}" data-tp="captcha"><span class="box">${topupFlow.human?"&#10003;":""}</span>I am not a robot</button><div class="err" id="topupError"></div><div class="row"><button class="primary" data-tp="proceed" ${ready?"":"disabled"}>Proceed</button></div>`;
        return;
    }
    const topup=topupFlow.topup;
    if(topupFlow.view==="checkout"){
        body.innerHTML=`${message}<b>PayRex Checkout</b><br>Ref: ${topup.ref}<br>Amount: PHP ${topup.php} for ${fmtGold(topup.php)}<br>Expires: ${fmtDate(topup.expiresAt)}<br><br><button class="primary" data-tp="pay">Pay with GCash</button>`;
        return;
    }
    body.innerHTML=`${message}<b>Topup ${topup.id}: ${topup.status}</b><br><br><button data-tp="replay">Replay webhook</button> <button class="primary" data-tp="again">New topup</button>`;
}

function createTopup(){
    const error=byId("topupError");
    if(isBanned()){
        error.textContent="Banned accounts cannot create topups.";
        return;
    }
    expireStaleTopups();
    let topup=topups.find(item=>item.userId===currentUser.id&&item.status==="pending");
    let message="Checkout created.";
    if(topup){
        message="You already have a pending checkout. Showing it.";
    }else{
        const now=Date.now();
        topup={id:newId("t"),userId:currentUser.id,php:topupFlow.pkg,status:"pending",createdAt:now,expiresAt:now+TOPUP_TTL,updatedAt:now,ref:"cs_"+Math.random().toString(36).slice(2,10)};
        topups.push(topup);
    }
    topupFlow={view:"checkout",topup,message};
    renderTopup();
}

byId("topupBody").onclick=event=>{
    const button=event.target.closest("button");
    if(!button){
        return;
    }
    if(button.dataset.pkg){
        topupFlow.pkg=Number(button.dataset.pkg);
        renderTopup();
        return;
    }
    const action=button.dataset.tp;
    const topup=topupFlow.topup;
    if(action==="captcha"){
        topupFlow.human=true;
    }
    if(action==="proceed"){
        createTopup();
        return;
    }
    if(action==="pay"){
        webhook(topup.id);
        topupFlow={view:"done",topup,message:`Payment confirmed. ${fmtGold(topup.php)} credited.`};
        refreshChrome();
    }
    if(action==="replay"){
        const result=webhook(topup.id);
        topupFlow.message=result==="duplicate"?"Duplicate webhook acknowledged. No changes made.":"Credited.";
    }
    if(action==="again"){
        topupFlow=freshTopup();
    }
    renderTopup();
};

function overviewHtml(){
    const completed=topups.filter(topup=>topup.status==="completed");
    const raised=completed.reduce((sum,topup)=>sum+topup.php,0);
    const spent=entities.reduce((sum,entity)=>sum+entity.info.cost,0);
    const typeLines=BUILDINGS.map((building,index)=>`${building.name}: ${entities.filter(entity=>entity.type===index).length}`).join("<br>");
    const cards=[
        ["Total raised","PHP "+raised.toLocaleString()],
        ["Completed topups",completed.length],
        ["Pending topups",topups.filter(topup=>topup.status==="pending").length],
        ["Failed or expired",topups.filter(topup=>topup.status==="failed"||topup.status==="expired").length],
        ["Buildings placed",entities.length],
        ["Gold spent",fmtGold(spent)],
        ["Users",users.length],
        ["Banned users",users.filter(user=>user.role==="banned").length]
    ];
    return `<div class="cards">${cards.map(([label,value])=>`<div class="card">${label}<b>${value}</b></div>`).join("")}<div class="card">Buildings by type<br>${typeLines}</div></div><div class="ph">Earnings over time (image placeholder)</div><div class="ph">Buildings by type (image placeholder)</div>`;
}

function shownBuildings(){
    return entities
        .filter(entity=>nameOf(entity.info.ownerId).includes(adminFilters.buildingUser.toLowerCase())&&(adminFilters.buildingType==="all"||String(entity.type)===adminFilters.buildingType))
        .sort((first,second)=>second.info.at-first.info.at);
}

function adminTableHtml(){
    if(adminTab==="topups"){
        const rows=topups
            .filter(topup=>nameOf(topup.userId).includes(adminFilters.topupUser.toLowerCase())&&(adminFilters.topupStatus==="all"||topup.status===adminFilters.topupStatus))
            .sort((first,second)=>adminFilters.topupSort==="asc"?first.createdAt-second.createdAt:second.createdAt-first.createdAt)
            .map(topup=>[topup.id,esc(nameOf(topup.userId)),"PHP "+topup.php,topup.status,fmtDate(topup.createdAt)]);
        return table(["ID","User","Amount","Status","Created"],rows);
    }
    if(adminTab==="buildings"){
        const rows=shownBuildings().map(entity=>[`<input type="checkbox" data-bsel="${entity.info.id}" ${adminSelected.has(entity.info.id)?"checked":""}>`,esc(entity.info.name),BUILDINGS[entity.type].name,esc(nameOf(entity.info.ownerId)),entity.x+", "+entity.y,fmtGold(entity.info.cost),fmtDate(entity.info.at),`<button data-do="rmb" data-bid="${entity.info.id}">Remove</button>`]);
        return table([`<input type="checkbox" id="selAll" data-all="1">`,"Name","Type","Owner","Cell","Spent","Placed","Action"],rows);
    }
    if(adminTab==="logs"){
        const rows=events
            .filter(event=>MOD_TYPES.includes(event.type)&&(adminFilters.logType==="all"||event.type===adminFilters.logType))
            .sort(newest)
            .map(event=>[fmtDate(event.at),event.type,esc(nameOf(event.actorId)),esc(nameOf(event.targetId)),event.delta?signed(event.delta):"",esc(event.reason||""),detail(event.data)]);
        return table(["Date","Type","Actor","Target","Gold","Reason","Details"],rows);
    }
    const rows=users
        .filter(user=>user.username.includes(adminFilters.userSearch.toLowerCase()))
        .map(user=>{
            const protectedCell=user.role==="admin";
            const banLabel=user.role==="banned"?"Unban":"Ban";
            const banAction=user.role==="banned"?"unban":"ban";
            const actionsCell=protectedCell?"protected":`<button data-do="${banAction}" data-user="${user.id}">${banLabel}</button> <button data-do="credit" data-user="${user.id}">Credit</button>`;
            return [esc(user.username),user.role,fmtGold(user.gold),fmtDate(user.createdAt),actionsCell];
        });
    return table(["Username","Role","Gold","Joined","Actions"],rows);
}

function syncBulk(){
    const button=byId("bulkBtn");
    if(!button){
        return;
    }
    button.textContent="Remove selected ("+adminSelected.size+")";
    button.disabled=adminSelected.size===0;
    const selectAll=byId("selAll");
    if(!selectAll){
        return;
    }
    const shown=shownBuildings();
    selectAll.checked=shown.length>0&&shown.every(entity=>adminSelected.has(entity.info.id));
}

byId("adminBody").addEventListener("change",event=>{
    const target=event.target;
    if(target.dataset.bsel){
        const buildingId=Number(target.dataset.bsel);
        if(target.checked){
            adminSelected.add(buildingId);
        }else{
            adminSelected.delete(buildingId);
        }
        syncBulk();
        return;
    }
    if(target.dataset.all){
        shownBuildings().forEach(entity=>{
            if(target.checked){
                adminSelected.add(entity.info.id);
            }else{
                adminSelected.delete(entity.info.id);
            }
        });
        renderAdminTable();
    }
});

byId("adminBody").addEventListener("click",event=>{
    const button=event.target.closest("button");
    if(!button||!button.dataset.do){
        return;
    }
    const action=button.dataset.do;
    if(action==="rmb"){
        const entity=entities.find(item=>String(item.info.id)===button.dataset.bid);
        askRemove([entity],"Remove "+entity.info.name);
        return;
    }
    if(action==="rmsel"){
        const targets=entities.filter(entity=>adminSelected.has(entity.info.id));
        if(!targets.length){
            return;
        }
        askRemove(targets,"Remove "+targets.length+" building(s)");
        return;
    }
    const user=userById(button.dataset.user);
    if(action==="ban"){
        const owned=entities.filter(entity=>entity.info.ownerId===user.id).length;
        askReason("Ban "+user.username+" ("+owned+" buildings)",{ban:true},(reason,amount,flags)=>adminBan(user.id,reason,flags));
    }
    if(action==="credit"){
        askReason("Credit gold to "+user.username,{amount:true},(reason,amount)=>adminCredit(user.id,amount,reason));
    }
    if(action==="unban"){
        const error=adminUnban(user.id);
        toast(error||"Unbanned "+user.username);
        afterAdminChange();
    }
});

function loadTexture(src){
    return new Promise(resolve=>{
        if(!src){
            resolve(PIXI.Texture.WHITE);
            return;
        }
        const image=new Image();
        image.crossOrigin="anonymous";
        image.onload=()=>resolve(PIXI.Texture.from(image));
        image.onerror=()=>resolve(PIXI.Texture.WHITE);
        image.src=src;
    });
}

async function main(){
    const app=new PIXI.Application();
    await app.init({resizeTo:window,background:"#f8f9fa",antialias:true});
    document.body.appendChild(app.canvas);

    byId("toggle").onclick=()=>drawer.classList.toggle("collapsed");

    const world=new PIXI.Container();
    app.stage.addChild(world);
    world.x=window.innerWidth/2-(GRID*CELL)/2;
    world.y=window.innerHeight/2-(GRID*CELL)/2;

    const grid=new PIXI.Graphics();
    for(let line=0;line<=GRID;line++){
        grid.moveTo(line*CELL,0).lineTo(line*CELL,GRID*CELL).moveTo(0,line*CELL).lineTo(GRID*CELL,line*CELL);
    }
    grid.stroke({width:1,color:0xe5e7eb,pixelLine:true});
    world.addChild(grid);

    const roadGraphics=new PIXI.Graphics(), entityLayer=new PIXI.Container(), roamerLayer=new PIXI.Container();
    world.addChild(roadGraphics,entityLayer,roamerLayer);

    const hover=new PIXI.Graphics().rect(0,0,CELL,CELL).fill({color:0x111827,alpha:0.08});
    hover.visible=false;
    const pickLayer=new PIXI.Graphics();
    const highlight=new PIXI.Graphics().rect(0,0,CELL,CELL).stroke({width:2,color:0x111827});
    highlight.visible=false;
    world.addChild(hover,pickLayer,highlight);

    const label=new PIXI.Container();
    const labelBg=new PIXI.Graphics();
    const labelText=new PIXI.Text({text:"",style:{fontSize:12,fontWeight:"600",fill:0xffffff,fontFamily:"Inter, Arial, sans-serif"},resolution:2});
    labelText.anchor.set(0.5);
    label.addChild(labelBg,labelText);
    label.visible=false;
    world.addChild(label);

    function showLabel(entity){
        labelText.text=entity.info.name;
        const width=labelText.width+LABEL_PAD*2;
        const height=labelText.height+LABEL_PAD;
        labelBg.clear().roundRect(-width/2,-height/2,width,height,4).fill({color:0x111827,alpha:0.9});
        label.x=entity.x*CELL+CELL/2;
        label.y=entity.y*CELL+CELL/2-SPRITE_SIZE/2-height/2-BOB_AMP-4;
        label.visible=true;
    }

    actions.drawPicks=()=>{
        pickLayer.clear();
        if(!picked.size){
            return;
        }
        picked.forEach(entity=>pickLayer.rect(entity.x*CELL+2,entity.y*CELL+2,CELL-4,CELL-4));
        pickLayer.fill({color:0x2563eb,alpha:0.25});
        pickLayer.stroke({width:2,color:0x2563eb});
    };

    const textures=await Promise.all(BUILDINGS.map(building=>loadTexture(building.src)));
    const roamerTextures=await Promise.all(ROAMER_SRCS.map(loadTexture));

    function placeEntity(x,y,type,info){
        const key=cellKey(x,y);
        if(entityMap.has(key)){
            return;
        }
        const texture=textures[type];
        const sprite=new PIXI.Sprite(texture);
        sprite.anchor.set(0.5);
        sprite.scale.set(SPRITE_SIZE/Math.max(texture.width,texture.height));
        sprite.tint=texture===PIXI.Texture.WHITE?FALLBACK_TINT:0xffffff;
        sprite.x=x*CELL+CELL/2;
        sprite.y=y*CELL+CELL/2;
        entityLayer.addChild(sprite);
        const entity={x,y,type,sprite,info,roamer:null,baseY:sprite.y,phase:Math.random()*Math.PI*2,speed:BOB_SPEED_MIN+Math.random()*(BOB_SPEED_MAX-BOB_SPEED_MIN)};
        entities.push(entity);
        entityMap.set(key,entity);
        if(ROAD_TYPES.includes(type)){
            refreshRoads();
        }
        if(type===ROAM_TYPE){
            entity.roamer=spawnRoamer(entity);
        }
    }

    actions.removeEntity=entity=>{
        picked.delete(entity);
        entityLayer.removeChild(entity.sprite);
        entity.sprite.destroy();
        entities.splice(entities.indexOf(entity),1);
        entityMap.delete(cellKey(entity.x,entity.y));
        if(entity.roamer){
            roamerLayer.removeChild(entity.roamer.sprite);
            entity.roamer.sprite.destroy();
            roamers.splice(roamers.indexOf(entity.roamer),1);
        }
        if(ROAD_TYPES.includes(entity.type)){
            refreshRoads();
        }
    };

    function findNearestSame(entity){
        let nearest=null, minDistance=Infinity;
        for(let deltaY=-ROAD_RADIUS;deltaY<=ROAD_RADIUS;deltaY++){
            for(let deltaX=-ROAD_RADIUS;deltaX<=ROAD_RADIUS;deltaX++){
                if(!deltaX&&!deltaY){
                    continue;
                }
                const nextX=entity.x+deltaX, nextY=entity.y+deltaY;
                if(nextX<0||nextY<0||nextX>=GRID||nextY>=GRID){
                    continue;
                }
                const neighbor=entityMap.get(cellKey(nextX,nextY));
                if(neighbor&&ROAD_TYPES.includes(neighbor.type)){
                    const distance=deltaX*deltaX+deltaY*deltaY;
                    if(distance<minDistance){
                        minDistance=distance;
                        nearest=neighbor;
                    }
                }
            }
        }
        return nearest;
    }

    function refreshRoads(){
        roadGraphics.clear();
        const drawn=new Set();
        entities.forEach(entity=>{
            if(!ROAD_TYPES.includes(entity.type)){
                return;
            }
            const target=findNearestSame(entity);
            if(!target){
                return;
            }
            const keyA=cellKey(entity.x,entity.y), keyB=cellKey(target.x,target.y), pairKey=Math.min(keyA,keyB)+"-"+Math.max(keyA,keyB);
            if(drawn.has(pairKey)){
                return;
            }
            drawn.add(pairKey);
            roadGraphics.moveTo(entity.x*CELL+CELL/2,entity.y*CELL+CELL/2).lineTo(target.x*CELL+CELL/2,target.y*CELL+CELL/2);
        });
        roadGraphics.stroke({width:ROAD_WIDTH,color:ROAD_COLOR});
    }

    const randomPause=()=>ROAM_PAUSE_MIN+Math.random()*(ROAM_PAUSE_MAX-ROAM_PAUSE_MIN);
    const pickTarget=roamer=>{
        const angle=Math.random()*Math.PI*2, distance=Math.random()*ROAM_RADIUS;
        roamer.targetX=roamer.homeX+Math.cos(angle)*distance;
        roamer.targetY=roamer.homeY+Math.sin(angle)*distance;
    };

    function spawnRoamer(entity){
        const roamerTexture=roamerTextures[Math.floor(Math.random()*roamerTextures.length)];
        const dot=new PIXI.Sprite(roamerTexture);
        dot.anchor.set(0.5);
        dot.scale.set(ROAMER_SIZE/Math.max(roamerTexture.width,roamerTexture.height));
        dot.tint=roamerTexture===PIXI.Texture.WHITE?0x111827:0xffffff;
        dot.x=entity.x*CELL+CELL/2;
        dot.y=entity.y*CELL+CELL/2;
        
        roamerLayer.addChild(dot);
        const roamer={sprite:dot,homeX:dot.x,homeY:dot.y,targetX:dot.x,targetY:dot.y,wait:randomPause()};
        pickTarget(roamer);
        roamers.push(roamer);
        return roamer;
    }

    let clock=0;
    app.ticker.add(ticker=>{
        const seconds=ticker.deltaMS/1000;
        clock+=seconds;
        entities.forEach(entity=>{
            entity.sprite.y=entity.baseY+Math.sin(clock*entity.speed+entity.phase)*BOB_AMP;
        });
        roamers.forEach(roamer=>{
            if(roamer.wait>0){
                roamer.wait-=seconds;
                return;
            }
            const deltaX=roamer.targetX-roamer.sprite.x, deltaY=roamer.targetY-roamer.sprite.y, distance=Math.hypot(deltaX,deltaY), step=ROAM_SPEED*seconds;
            if(distance<=step){
                roamer.sprite.x=roamer.targetX;
                roamer.sprite.y=roamer.targetY;
                roamer.wait=randomPause();
                pickTarget(roamer);
                return;
            }
            roamer.sprite.x+=(deltaX/distance)*step;
            roamer.sprite.y+=(deltaY/distance)*step;
        });
    });

    for(let cellY=CENTER_START;cellY<CENTER_END;cellY++){
            const centerCell=(CENTER_START+CENTER_END)/2;
    let attempts=0;
    while(entities.length<SCATTER_COUNT&&attempts<SCATTER_COUNT*10){
        attempts++;
        const angle=Math.random()*Math.PI*2;
        const radius=Math.random()*SCATTER_RADIUS;
        const cellX=Math.round(centerCell+Math.cos(angle)*radius);
        const cellY=Math.round(centerCell+Math.sin(angle)*radius);
        if(entityMap.has(cellKey(cellX,cellY))){
            continue;
        }
        const type=Math.floor(Math.random()*BUILDINGS.length);
        const owner=seedUsers[Math.floor(Math.random()*seedUsers.length)];
        placeEntity(cellX,cellY,type,createInfo(type,BUILDINGS[type].name+" "+(buildingCounter+1),owner.id));
    }
    }

    const menu=byId("menu"), infoPanel=byId("info"), modal=byId("modal");
    const summary=byId("summary"), nameInput=byId("nameInput"), confirmError=byId("confirmError");

    function showInfo(entity){
        const building=BUILDINGS[entity.type];
        const removeButton=isAdmin()?`<br><button id="removeBtn">Remove (admin)</button>`:"";
        infoPanel.innerHTML=`<b>${esc(entity.info.name)}</b><br>Type: ${building.name}<br>Placed by: ${esc(nameOf(entity.info.ownerId))}<br>Date: ${fmtDate(entity.info.at)}<br>Cost: ${fmtGold(entity.info.cost)}<br>Cell: ${entity.x}, ${entity.y}${removeButton}`;
        infoPanel.style.display="block";
        showLabel(entity);
        if(!isAdmin()){
            return;
        }
        byId("removeBtn").onclick=()=>askRemove([entity],"Remove "+entity.info.name);
    }

    function openConfirm(type){
        const building=BUILDINGS[type];
        pendingType=type;
        confirmError.textContent="";
        summary.innerHTML=`Type: ${building.name}<br>Placed by: ${esc(currentUser.username)}<br>Cost: ${fmtGold(building.cost)}<br>Balance: ${fmtGold(currentUser.gold)}<br>Cell: ${selectedCell.x}, ${selectedCell.y}`;
        nameInput.value=`${building.name} ${buildingCounter+1}`;
        toggleModal(modal,true);
    }

    const closeConfirm=()=>{
        pendingType=null;
        toggleModal(modal,false);
    };
    byId("cancel").onclick=closeConfirm;

    byId("confirm").onclick=()=>{
        if(!selectedCell||pendingType===null){
            return;
        }
        if(isBanned()){
            confirmError.textContent="Banned accounts cannot place buildings.";
            return;
        }
        if(entityMap.has(cellKey(selectedCell.x,selectedCell.y))){
            confirmError.textContent="Tile already taken.";
            return;
        }
        const building=BUILDINGS[pendingType];
        if(currentUser.gold<building.cost){
            confirmError.textContent="Insufficient gold. Top up first.";
            return;
        }
        const finalName=nameInput.value.trim()||building.name;
        const info=createInfo(pendingType,finalName,currentUser.id);
        currentUser.gold-=building.cost;
        placeEntity(selectedCell.x,selectedCell.y,pendingType,info);
        logEvent("building_placed",currentUser.id,currentUser.id,-building.cost,null,{building_id:info.id,building_type:building.name,x:selectedCell.x,y:selectedCell.y});
        closeConfirm();
        clearSelection();
        refreshChrome();
        toast("Placed "+finalName);
    };

    BUILDINGS.forEach((building,index)=>{
        const button=document.createElement("button");
        button.innerHTML=`<img src="${esc(building.src)}" alt="" onerror="this.style.display='none'"><span>${building.name} (${building.cost} g)</span>`;
        button.onclick=()=>selectedCell&&openConfirm(index);
        menu.appendChild(button);
    });

    clearSelection=function(){
        selectedCell=null;
        highlight.visible=false;
        label.visible=false;
        menu.style.display="none";
        infoPanel.style.display="none";
    };

    function cellAt(screenX,screenY){
        const cellX=Math.floor((screenX-world.x)/world.scale.x/CELL);
        const cellY=Math.floor((screenY-world.y)/world.scale.y/CELL);
        const inBounds=cellX>=0&&cellY>=0&&cellX<GRID&&cellY<GRID;
        return {cellX,cellY,inBounds};
    }

    function handleClick(screenX,screenY,multi){
        const {cellX,cellY,inBounds}=cellAt(screenX,screenY);
        if(isAdmin()&&(selectMode||multi)){
            if(!inBounds){
                return;
            }
            const target=entityMap.get(cellKey(cellX,cellY));
            if(!target){
                return;
            }
            if(picked.has(target)){
                picked.delete(target);
            }else{
                picked.add(target);
            }
            clearSelection();
            actions.drawPicks();
            updatePickBar();
            return;
        }
        clearSelection();
        if(!inBounds){
            return;
        }
        selectedCell={x:cellX,y:cellY};
        highlight.x=cellX*CELL;
        highlight.y=cellY*CELL;
        highlight.visible=true;
        const existing=entityMap.get(cellKey(cellX,cellY));
        if(existing){
            showInfo(existing);
            return;
        }
        if(currentUser){
            menu.style.display="flex";
        }
    }

    const activePointers=new Map();
    let isMultiTouch=false, initialPinchDist=0, initialScale=1;
    let dragStartX=0, dragStartY=0, worldStartX=0, worldStartY=0, hasMoved=false;

    app.canvas.addEventListener("pointerdown",event=>{
        activePointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
        if(activePointers.size===1){
            isMultiTouch=false;
            hasMoved=false;
            dragStartX=event.clientX;
            dragStartY=event.clientY;
            worldStartX=world.x;
            worldStartY=world.y;
        }else if(activePointers.size===2){
            isMultiTouch=true;
            hasMoved=true;
            const points=[...activePointers.values()];
            initialPinchDist=Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y);
            initialScale=world.scale.x;
        }
    });

    app.canvas.addEventListener("pointermove",event=>{
        if(event.pointerType!=="mouse"||activePointers.size>0){
            hover.visible=false;
            return;
        }
        const {cellX,cellY,inBounds}=cellAt(event.clientX,event.clientY);
        hover.visible=inBounds;
        hover.x=cellX*CELL;
        hover.y=cellY*CELL;
    });

    app.canvas.addEventListener("pointerleave",()=>{
        hover.visible=false;
    });

    window.addEventListener("pointermove",event=>{
        if(!activePointers.has(event.pointerId)){
            return;
        }
        activePointers.set(event.pointerId,{x:event.clientX,y:event.clientY});

        if(activePointers.size===1&&!isMultiTouch){
            const deltaX=event.clientX-dragStartX, deltaY=event.clientY-dragStartY;
            if(Math.hypot(deltaX,deltaY)>DRAG_THRESHOLD){
                hasMoved=true;
            }
            if(hasMoved){
                world.x=worldStartX+deltaX;
                world.y=worldStartY+deltaY;
            }
        }else if(activePointers.size===2){
            const points=[...activePointers.values()];
            const distance=Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y);
            if(initialPinchDist>0){
                const factor=distance/initialPinchDist;
                const nextScale=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,initialScale*factor));
                const midX=(points[0].x+points[1].x)/2, midY=(points[0].y+points[1].y)/2;
                const worldX=(midX-world.x)/world.scale.x, worldY=(midY-world.y)/world.scale.y;
                world.scale.set(nextScale);
                world.x=midX-worldX*nextScale;
                world.y=midY-worldY*nextScale;
            }
        }
    });

    const handlePointerUp=event=>{
        if(!activePointers.has(event.pointerId)){
            return;
        }
        activePointers.delete(event.pointerId);
        if(activePointers.size===0){
            if(!hasMoved&&!isMultiTouch){
                handleClick(event.clientX,event.clientY,event.shiftKey||event.ctrlKey);
            }
            isMultiTouch=false;
        }else if(activePointers.size===1){
            const point=[...activePointers.values()][0];
            dragStartX=point.x;
            dragStartY=point.y;
            worldStartX=world.x;
            worldStartY=world.y;
        }
    };

    window.addEventListener("pointerup",handlePointerUp);
    window.addEventListener("pointercancel",handlePointerUp);

    app.canvas.addEventListener("wheel",event=>{
        event.preventDefault();
        const factor=event.deltaY<0?1.1:1/1.1;
        const nextScale=Math.min(MAX_ZOOM,Math.max(MIN_ZOOM,world.scale.x*factor));
        const worldX=(event.clientX-world.x)/world.scale.x, worldY=(event.clientY-world.y)/world.scale.y;
        world.scale.set(nextScale);
        world.x=event.clientX-worldX*nextScale;
        world.y=event.clientY-worldY*nextScale;
    },{passive:false});
}

refreshChrome();
main();
</script>
</body>
</html>
